<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cute — Character × effect matrix</title>
  <style>
    *{box-sizing:border-box}:root{font-family:Arial,Helvetica,sans-serif;color:#392a24;background:#efe7dc}body{margin:0;padding:24px}header{display:grid;gap:12px;margin-bottom:20px;position:sticky;top:0;z-index:3;background:rgba(239,231,220,.94);backdrop-filter:blur(12px);padding:12px 0}h1,p{margin:0}.summary,.filters{display:flex;flex-wrap:wrap;gap:8px}.summary span{border:1px solid #cbbcae;border-radius:999px;padding:5px 9px;background:#fffaf3;font-size:12px}.filters select{border:1px solid #cbbcae;border-radius:10px;background:#fffaf3;padding:8px}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.case{min-width:0;border:1px solid #d6c7b8;border-radius:18px;overflow:hidden;background:#fffaf3}.art{aspect-ratio:1;display:grid;place-items:center;padding:10px;background:linear-gradient(135deg,#ffe6bd,#eadcff)}.art.is-mobile{max-height:190px}.art canvas{display:block;width:100%;height:100%}.meta{display:grid;gap:4px;padding:11px 12px 13px}.meta span,.meta small{color:#755f54}code{overflow-wrap:anywhere;font-size:10px}.is-blocked{border-style:dashed}.blocked{max-width:150px;text-align:center;font-size:12px}.case[hidden]{display:none}.render-error{font-size:11px;color:#9c3428;padding:12px}@media(max-width:520px){body{padding:10px}main{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.meta{padding:8px}.meta code{display:none}}
  </style>
</head>
<body>
  <header>
    <div><small>ISSUE 27 / DETERMINISTIC ART DIRECTION QA</small><h1>Character × effect matrix</h1><p>Actual seeded Canvas treatments across the expanded roster and mixed-media fixtures.</p></div>
    <div class="summary" id="summary"><span>Loading authored inputs…</span></div>
    <div class="filters"><select id="characterFilter"><option value="">All characters</option></select><select id="presetFilter"><option value="">All presets</option><option value="default">Default</option></select><select id="mediaFilter"><option value="">All media</option><option value="vector">Vector</option><option value="raster">Raster</option><option value="mixed">Mixed</option></select><select id="actionFilter"><option value="">All actions</option><option value="allow">Allow</option><option value="reduce">Reduce</option><option value="replace">Replace</option><option value="block">Block</option></select></div>
  </header>
  <main id="matrix"></main>
  <script src="../../mixed-asset-v2.js"></script>
  <script src="../../effects.js"></script>
  <script>
    const BASE="../../"; const stable=(...parts)=>parts.filter(Boolean).join("--").toLowerCase().replace(/[^a-z0-9-]+/g,"-").replace(/-{2,}/g,"-").replace(/^-|-$/g,"");
    const fetchJson=(file)=>fetch(BASE+file,{cache:"no-cache"}).then(response=>{if(!response.ok)throw new Error(file+" "+response.status);return response.json()});
    const rosterRules=(value)=>value==="reduce-plush"?{reduce:["soft-plush"]}:value==="replace-plush-with-gloss"?{replace:{"soft-plush":"candy-gloss"}}:{};
    function normalize(manifest,roster,mixed){const canonical=manifest.assets.filter(asset=>asset.type==="complete-face").map(asset=>({...asset,mediaMode:["png","webp"].includes(asset.format)?"raster":"vector",layers:null}));const expansion=roster.characters.map(item=>({...item,type:"complete-face",mediaMode:["png","webp"].includes(item.format)?"raster":"vector",effectCompatibility:rosterRules(item.compatibility?.effects),layers:null}));const fixtures=mixed.fixtures.map(item=>({id:item.id,label:item.label,mediaMode:item.mediaMode,sourceFile:item.previewFile,nativeCanvas:mixed.canonicalCanvas,exportBounds:item.exportBounds,effectCompatibility:{},layers:item.layers}));return [...new Map([...canonical,...expansion,...fixtures].map(item=>[item.id,item])).values()].sort((a,b)=>a.id.localeCompare(b.id))}
    function mergedRules(character,compat){const extra=compat.rules.find(rule=>rule.characterId===character.id)||{};const base=character.effectCompatibility||{};return{block:[...new Set([...(base.block||[]),...(extra.block||[])])],reduce:[...new Set([...(base.reduce||[]),...(extra.reduce||[])])],replace:{...(base.replace||{}),...(extra.replace||{})}}}
    function resolveAction(rules,preset){if(rules.block.includes(preset))return{action:"block",effective:preset,intensity:0};if(rules.replace[preset])return{action:"replace",effective:rules.replace[preset],intensity:1};if(rules.reduce.includes(preset))return{action:"reduce",effective:preset,intensity:.55};return{action:"allow",effective:preset,intensity:1}}
    async function loadImage(source){return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(new Error("Unable to load "+source));image.src=BASE+source})}
    async function renderCase(test,canvas,config){if(test.layers){await CuteMixedAssets.compose(canvas,test.layers.map(layer=>({...layer,sourceFile:BASE+layer.sourceFile})),{width:test.width,height:test.height,pixelRatio:1,maxPixelRatio:1,canonicalCanvas:{width:1000,height:1000},showPlaceholders:true})}else{const image=await loadImage(test.assetPath);const context=canvas.getContext("2d",{willReadFrequently:true});context.clearRect(0,0,canvas.width,canvas.height);context.drawImage(image,0,0,canvas.width,canvas.height)}if(test.effective){const resolved=CuteEffects.resolvePreset(config,test.effective).map(effect=>({...effect,intensity:Number(effect.intensity??effect.defaults?.intensity??0)*test.intensity}));CuteEffects.apply(canvas,resolved,{seed:test.seed,particleLimit:test.viewport==="mobile-thumbnail"?36:84})}}
    function card(test){const article=document.createElement("article");article.className="case"+(test.action==="block"?" is-blocked":"");article.id=test.testId;article.dataset.character=test.characterId;article.dataset.preset=test.presetId||"default";article.dataset.media=test.mediaMode;article.dataset.action=test.action;const label=test.action==="replace"?"replace → "+test.effective:test.action;article.innerHTML=`<div class="art${test.viewport==="mobile-thumbnail"?" is-mobile":""}">${test.action==="block"?'<div class="blocked">Blocked by compatibility rule</div>':`<canvas width="${test.width}" height="${test.height}"></canvas>`}</div><div class="meta"><strong>${test.characterLabel}</strong><span>${test.presetLabel}</span><code>${test.testId}</code><small>${label} · ${test.mediaMode} · seed ${test.seed}</small></div>`;return article}
    function applyFilters(){for(const item of document.querySelectorAll(".case")){item.hidden=[["character",characterFilter.value],["preset",presetFilter.value],["media",mediaFilter.value],["action",actionFilter.value]].some(([key,value])=>value&&item.dataset[key]!==value)}}
    (async()=>{const[manifest,roster,mixed,effects,compat]=await Promise.all([fetchJson("assets/manifest.json"),fetchJson("assets/roster-expansion.json"),fetchJson("assets/mixed-asset-fixtures.json"),fetchJson("assets/effects-presets.json"),fetchJson("assets/effect-compatibility.json")]);const characters=normalize(manifest,roster,mixed);const presets=[...effects.presets].sort((a,b)=>a.id.localeCompare(b.id));for(const character of characters)characterFilter.add(new Option(character.label,character.id));for(const preset of presets)presetFilter.add(new Option(preset.label,preset.id));const tests=[];for(const character of characters){const rules=mergedRules(character,compat);tests.push({testId:stable("default",character.id,"full"),characterId:character.id,characterLabel:character.label,presetId:null,presetLabel:"Default",effective:null,seed:effects.defaultSeed,action:"allow",intensity:0,assetPath:character.sourceFile,mediaMode:character.mediaMode,viewport:"full",width:1000,height:1000,layers:character.layers});for(const preset of presets){const result=resolveAction(rules,preset.id);for(const viewport of["full","mobile-thumbnail"])tests.push({testId:stable(viewport==="full"?"effect":"mobile",character.id,preset.id),characterId:character.id,characterLabel:character.label,presetId:preset.id,presetLabel:preset.label,effective:result.effective,seed:effects.defaultSeed,action:result.action,intensity:result.intensity,assetPath:character.sourceFile,mediaMode:character.mediaMode,viewport,width:viewport==="full"?1000:180,height:viewport==="full"?1000:180,layers:character.layers})}}summary.innerHTML=`<span>${characters.length} characters</span><span>${presets.length} presets</span><span>${tests.length} cases</span><span>seed ${effects.defaultSeed}</span>`;for(const test of tests){const element=card(test);matrix.append(element);const canvas=element.querySelector("canvas");if(canvas)try{await renderCase(test,canvas,effects)}catch(error){canvas.replaceWith(Object.assign(document.createElement("div"),{className:"render-error",textContent:error.message}));element.dataset.renderError="true"}}document.body.dataset.renderComplete="true";window.dispatchEvent(new CustomEvent("cute:character-effects-matrix-rendered"))})().catch(error=>{summary.innerHTML=`<span>Matrix failed: ${error.message}</span>`;console.error(error)});
    for(const control of document.querySelectorAll(".filters select"))control.addEventListener("change",applyFilters);
  </script>
</body>
</html>
