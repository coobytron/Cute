<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cute Face Builder — Finish comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #f5eee3; color: #38261d; font-family: Arial, Helvetica, sans-serif; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .intro { margin: 0 0 28px; color: #75645a; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 18px; }
    figure { margin: 0; padding: 14px; border: 1px solid #dfd1c3; border-radius: 20px; background: #fffaf2; box-shadow: 0 8px 24px rgba(65, 44, 33, .08); }
    .art { position: relative; overflow: hidden; aspect-ratio: 1; border-radius: 14px; background: #ffe9bd; }
    img { width: 100%; height: 100%; object-fit: contain; display: block; }
    figcaption { display: grid; gap: 3px; margin-top: 10px; }
    strong { font-size: 14px; }
    small { color: #8a776c; }
    .paper::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(92,61,42,.18) 0 1px, transparent 1.2px); background-size: 11px 13px; opacity: .34; mix-blend-mode: multiply; }
    .clean { background: #fff; }
    .thermal img { filter: grayscale(1) contrast(1.72) brightness(1.04); }
    .thermal::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(45,39,35,.75) 0 1px, transparent 1.2px); background-size: 8px 8px; opacity: .28; mix-blend-mode: multiply; }
    .sticker img { filter: drop-shadow(7px 0 0 #fff) drop-shadow(-7px 0 0 #fff) drop-shadow(0 7px 0 #fff) drop-shadow(0 -7px 0 #fff) drop-shadow(0 12px 9px rgba(61,48,40,.2)); transform: scale(.88); }
    .thermal-sizes { margin-top: 28px; display: flex; align-items: flex-start; gap: 22px; flex-wrap: wrap; }
    .thermal-sizes figure { width: auto; }
    .w384 .art { width: 384px; }
    .w576 .art { width: 576px; }
    @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, 1fr); } .w576 .art { width: min(576px, 82vw); } }
  </style>
</head>
<body>
  <h1>Art-direction finish comparison</h1>
  <p class="intro">Deterministic review of one approved authored face through all four MVP finish recipes.</p>

  <section class="grid" aria-label="Four finish comparison">
    <figure><div class="art paper"><img src="../../assets/complete-faces/face-mochi-cat.svg" alt="Mochi Cat on classic paper" /></div><figcaption><strong>Classic paper</strong><small>Warm tactile grain</small></figcaption></figure>
    <figure><div class="art clean"><img src="../../assets/complete-faces/face-mochi-cat.svg" alt="Mochi Cat in clean studio" /></div><figcaption><strong>Clean studio</strong><small>Neutral and crisp</small></figcaption></figure>
    <figure><div class="art thermal"><img src="../../assets/complete-faces/face-mochi-cat.svg" alt="Mochi Cat with thermal treatment" /></div><figcaption><strong>Thermal print</strong><small>Monochrome dither</small></figcaption></figure>
    <figure><div class="art sticker"><img src="../../assets/complete-faces/face-mochi-cat.svg" alt="Mochi Cat with sticker cutline" /></div><figcaption><strong>Sticker</strong><small>White cutline and shadow</small></figcaption></figure>
  </section>

  <section class="thermal-sizes" aria-label="Thermal output size review">
    <figure class="w384"><div class="art thermal"><img src="../../assets/complete-faces/face-mochi-cat.svg" alt="Thermal treatment at 384 pixels" /></div><figcaption><strong>384 px thermal review</strong><small>Small printer target</small></figcaption></figure>
    <figure class="w576"><div class="art thermal"><img src="../../assets/complete-faces/face-mochi-cat.svg" alt="Thermal treatment at 576 pixels" /></div><figcaption><strong>576 px thermal review</strong><small>Wide printer target</small></figcaption></figure>
  </section>
</body>
</html>
