<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- face-coco-raccoon | Raccoon | powder-sky | accessory-anchor: 740,310 -->
  <defs>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#3d3028" flood-opacity=".14"/>
    </filter>
    <style>.o{stroke:#2d2723;stroke-width:18;stroke-linecap:round;stroke-linejoin:round}.d{stroke:#2d2723;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <g filter="url(#s)">
    <!-- rounded ears with inner -->
    <circle cx="300" cy="305" r="104" fill="#B8C0D0" class="o"/>
    <circle cx="700" cy="305" r="104" fill="#B8C0D0" class="o"/>
    <circle cx="300" cy="305" r="58" fill="#E8C0C8" class="d"/>
    <circle cx="700" cy="305" r="58" fill="#E8C0C8" class="d"/>
    <!-- head/body -->
    <path d="M250 375 C205 295 258 218 352 252 Q500 210 648 252 C742 218 795 295 750 375 C830 450 842 618 775 745 C710 862 610 910 500 912 C390 910 290 862 225 745 C158 618 170 450 250 375Z" fill="#B8C0D0" class="o"/>
    <!-- raccoon eye mask -->
    <ellipse cx="378" cy="488" rx="82" ry="60" fill="#606070" opacity=".72"/>
    <ellipse cx="622" cy="488" rx="82" ry="60" fill="#606070" opacity=".72"/>
    <!-- mask bridge -->
    <rect x="420" y="462" width="160" height="30" rx="15" fill="#606070" opacity=".50"/>
    <!-- eyes (glossy) -->
    <ellipse cx="378" cy="488" rx="38" ry="44" fill="#2d2723"/>
    <ellipse cx="622" cy="488" rx="38" ry="44" fill="#2d2723"/>
    <circle cx="393" cy="470" r="13" fill="#fff"/>
    <circle cx="637" cy="470" r="13" fill="#fff"/>
    <!-- blush cheeks -->
    <ellipse cx="290" cy="640" rx="62" ry="32" fill="#FF93A5" opacity=".78"/>
    <ellipse cx="710" cy="640" rx="62" ry="32" fill="#FF93A5" opacity=".78"/>
    <!-- white face patches / muzzle -->
    <ellipse cx="445" cy="660" rx="100" ry="78" fill="#F0F0F5"/>
    <ellipse cx="555" cy="660" rx="100" ry="78" fill="#F0F0F5"/>
    <!-- nose -->
    <ellipse cx="500" cy="618" rx="34" ry="24" fill="#2d2723"/>
    <!-- mouth -->
    <path d="M500 642 Q500 693 456 700 M500 642 Q500 693 544 700" fill="none" class="d"/>
    <!-- raccoon forehead stripes -->
    <path d="M462 348 Q500 336 538 348" fill="none" stroke="#7A7A92" stroke-width="10" stroke-linecap="round"/>
    <path d="M472 325 Q500 313 528 325" fill="none" stroke="#7A7A92" stroke-width="8" stroke-linecap="round"/>
    <!-- whiskers -->
    <line x1="225" y1="640" x2="378" y2="652" stroke="#2d2723" stroke-width="6" stroke-linecap="round" opacity=".45"/>
    <line x1="225" y1="668" x2="376" y2="668" stroke="#2d2723" stroke-width="6" stroke-linecap="round" opacity=".45"/>
    <line x1="622" y1="652" x2="775" y2="640" stroke="#2d2723" stroke-width="6" stroke-linecap="round" opacity=".45"/>
    <line x1="624" y1="668" x2="775" y2="668" stroke="#2d2723" stroke-width="6" stroke-linecap="round" opacity=".45"/>
  </g>
</svg>
