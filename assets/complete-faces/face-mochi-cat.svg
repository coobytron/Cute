    <!-- mouth -->
    <path d="M500 646 Q500 697 452 704 M500 646 Q500 697 548 704" fill="none" class="d"/>
    <!-- whiskers -->
    <line x1="235" y1="618" x2="380" y2="640" stroke="#2d2723" stroke-width="7" stroke-linecap="round" opacity=".55"/>
    <line x1="232" y1="648" x2="378" y2="652" stroke="#2d2723" stroke-width="7" stroke-linecap="round" opacity=".55"/>
    <line x1="622" y1="640" x2="765" y2="618" stroke="#2d2723" stroke-width="7" stroke-linecap="round" opacity=".55"/>
    <line x1="622" y1="652" x2="768" y2="648" stroke="#2d2723" stroke-width="7" stroke-linecap="round" opacity=".55"/>
