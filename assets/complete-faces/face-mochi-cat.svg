    <ellipse cx="685" cy="628" rx="67" ry="35" fill="#FF786B" opacity=".82"/>
    <!-- muzzle -->
    <ellipse cx="452" cy="642" rx="96" ry="70" fill="#FFF1DB"/>
    <ellipse cx="548" cy="642" rx="96" ry="70" fill="#FFF1DB"/>
    <!-- nose -->
