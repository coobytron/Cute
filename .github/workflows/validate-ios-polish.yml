name: Validate iOS polish

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ios-polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate iOS polish contract
        run: node scripts/validate-ios-polish.mjs
