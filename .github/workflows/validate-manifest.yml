name: Validate authored assets

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate authored asset manifest
        run: node scripts/validate-manifest.mjs

      - name: Validate complete-face library
        run: node scripts/validate-complete-faces.mjs

      - name: Validate Build-a-face catalog
        run: node scripts/validate-build-face.mjs

      - name: Check browser script syntax
        run: |
          node --check complete-face.js
          node --check complete-face-state.js
          node --check build-face.js
          node --check art-direction.js
          node --check art-direction-bootstrap.js
          node --check history-saves.js
          node --check export-menu.js
          node --check responsive-a11y.js
          node --check scripts/validate-release.mjs

      - name: Validate art-direction contract
        run: node scripts/validate-art-direction.mjs

      - name: Validate history and saved variations
        run: node scripts/validate-history-saves.mjs

      - name: Validate export menu and fixtures
        run: node scripts/validate-export.mjs

      - name: Validate responsive accessibility contract
        run: node scripts/validate-responsive-a11y.mjs

      - name: Build aggregate MVP release report
        run: node scripts/validate-release.mjs

      - name: Upload release validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cute-face-builder-release-validation
          path: review-artifacts/release-validation.json
          if-no-files-found: warn
